<!doctype html><html><head><style>
body{margin:0;background:#808080;height:100vh}
.bg{position:absolute;inset:0;background-image:linear-gradient(#000 1px,transparent 1px),linear-gradient(90deg,#000 1px,transparent 1px);background-size:20px 20px}
.solid{position:absolute;left:0;top:400px;width:100%;height:300px;background:#0a0a0a}
#a{position:absolute;left:100px;top:100px;width:300px;height:120px;border-radius:60px}
#b{position:absolute;left:500px;top:60px;width:200px;height:200px;border-radius:100px}
#c{position:absolute;left:100px;top:450px;width:300px;height:160px;border-radius:32px}
</style></head><body><div class="bg"></div><div class="solid"></div>
<div id="a" class="liquid-glass"></div><div id="b" class="liquid-glass"></div><div id="c" class="liquid-glass"></div>
<script type="module">
import 'liquidglass/css'
import { createGlass } from 'liquidglass'
const q = new URLSearchParams(location.search)
const hide = (q.get('hide') || '').split(',')
for (const id of ['a','b','c']) createGlass(document.getElementById(id), JSON.parse(q.get('o') || '{}'))
requestAnimationFrame(() => {
  for (const h of hide) if (h) document.querySelectorAll(`[data-liquidglass-${h}]`).forEach(n => n.style.visibility = 'hidden')
  document.body.dataset.ready = '1'
})
</script></body></html>
